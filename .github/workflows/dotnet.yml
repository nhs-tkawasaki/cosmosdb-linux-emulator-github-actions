name: .NET App CI

on:
  push:
    branches: [main]
    paths:
      - 'dotnet-app/**'
  pull_request:
    branches: [main]
    paths:
      - 'dotnet-app/**'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]

    services:
      cosmosdb:
        image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
        ports:
          - 8081:8081
        env:
          PROTOCOL: https
          NODE_TLS_REJECT_UNAUTHORIZED: "0"

    env:
      COSMOSDB_CONNECTION_STRING: ${{ secrets.COSMOSDB_CONNECTION_STRING }}
      COSMOSDB_DATABASE_NAME: ${{ vars.COSMOSDB_DATABASE_NAME }}
      COSMOSDB_CONTAINER_NAME: ${{ vars.COSMOSDB_CONTAINER_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      #- name: Export Cosmos DB Emulator Certificate
      #  run: |
      #    sudo apt update && sudo apt install -y openssl
      #    openssl s_client -connect localhost:8081 </dev/null | sed -ne '/-BEGIN CERTIFICATE-/,/-END CERTIFICATE-/p' > cosmos_emulator.crt
      #    
      #    sudo cp cosmos_emulator.crt /usr/local/share/ca-certificates/
      #    sudo update-ca-certificates

      - name: Install dependencies
        run: cd dotnet-app && dotnet restore

      - name: Build
        run: cd dotnet-app && dotnet build --no-restore

      - name: Run tests
        run: |
          sudo apt update && sudo apt install -y openssl curl

          # 1. Cosmos Emulator の HTTPS エンドポイントが安定するまで待つ
          echo "Waiting for Cosmos DB Emulator to be ready..."
          for i in $(seq 1 30); do
            # readiness 的なエンドポイントを叩く（失敗しても無視）
            if curl -k --silent https://localhost:8081/ >/dev/null 2>&1; then
              echo "Cosmos DB Emulator is responding over HTTPS."
              break
            fi
            echo "  still not ready (try $i)..."
            sleep 2
          done

          # 2. 安定したタイミングで一度だけ証明書を取得
          echo "Exporting certificate from Cosmos DB Emulator..."
          openssl s_client -connect localhost:8081 -showcerts </dev/null \
            | sed -ne '/-BEGIN CERTIFICATE-/,/-END CERTIFICATE-/p' > cosmos_emulator.crt

          echo "Certificate subject / issuer:"
          openssl x509 -in cosmos_emulator.crt -noout -subject -issuer

          # 3. CA として登録
          sudo cp cosmos_emulator.crt /usr/local/share/ca-certificates/
          sudo update-ca-certificates

          echo "Registered CA entries:"
          ls -l /etc/ssl/certs | grep cosmos || echo "no cosmos entries in /etc/ssl/certs"

          # 4. 検証（この時点で verify が通るか確認）
          echo "Verifying TLS connection with system trust store..."
          echo | openssl s_client -connect localhost:8081 -verify_return_error || true

          echo "===== FULL CERT CHAIN FROM EMULATOR ====="
          openssl s_client -connect localhost:8081 -showcerts </dev/null

          echo "===== cosmos_emulator.crt subject / issuer / self-signed? ====="
          openssl x509 -in cosmos_emulator.crt -noout -subject -issuer -text | sed -n '1,20p'

          # 5. テスト実行
          cd dotnet-app && dotnet test --no-build --verbosity normal
