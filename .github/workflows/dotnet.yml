name: .NET App CI

on:
  push:
    branches: [main]
    paths:
      - 'dotnet-app/**'
  pull_request:
    branches: [main]
    paths:
      - 'dotnet-app/**'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]

    services:
      cosmosdb:
        image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
        ports:
          - 8081:8081
        env:
          PROTOCOL: https
          NODE_TLS_REJECT_UNAUTHORIZED: "0"

    env:
      COSMOSDB_CONNECTION_STRING: ${{ secrets.COSMOSDB_CONNECTION_STRING }}
      COSMOSDB_DATABASE_NAME: ${{ vars.COSMOSDB_DATABASE_NAME }}
      COSMOSDB_CONTAINER_NAME: ${{ vars.COSMOSDB_CONTAINER_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      #- name: Export Cosmos DB Emulator Certificate
      #  run: |
      #    sudo apt update && sudo apt install -y openssl
      #    openssl s_client -connect localhost:8081 </dev/null | sed -ne '/-BEGIN CERTIFICATE-/,/-END CERTIFICATE-/p' > cosmos_emulator.crt
      #    
      #    sudo cp cosmos_emulator.crt /usr/local/share/ca-certificates/
      #    sudo update-ca-certificates

      - name: Install dependencies
        run: cd dotnet-app && dotnet restore

      - name: Build
        run: cd dotnet-app && dotnet build --no-restore

      - name: Run tests
        run: |
          sudo apt update && sudo apt install -y openssl curl

          # 1. Cosmos Emulator の HTTPS エンドポイントが安定するまで待つ
          echo "Waiting for Cosmos DB Emulator to be ready..."
          for i in $(seq 1 30); do
            # readiness 的なエンドポイントを叩く（失敗しても無視）
            if curl -k --silent https://localhost:8081/ >/dev/null 2>&1; then
              echo "Cosmos DB Emulator is responding over HTTPS."
              break
            fi
            echo "  still not ready (try $i)..."
            sleep 2
          done

          # 2. 「CA」として配布されている pem があるかを試す
          echo "=== Trying to fetch emulator CA pem ==="
          curl -k https://localhost:8081/_explorer/emulator.pem -o cosmos_emulator_ca.crt || echo "failed to fetch emulator pem"

          if [ -s cosmos_emulator_ca.crt ]; then
            echo "Fetched emulator CA pem, registering as trusted CA..."
            sudo cp cosmos_emulator_ca.crt /usr/local/share/ca-certificates/cosmos_emulator_ca.crt
            sudo update-ca-certificates
          else
            echo "emulator.pem not available, falling back to s_client-extracted cert"
            openssl s_client -connect localhost:8081 -showcerts </dev/null \
            | sed -ne '/-BEGIN CERTIFICATE-/,/-END CERTIFICATE-/p' > cosmos_emulator.crt

            sudo cp cosmos_emulator.crt /usr/local/share/ca-certificates/cosmos_emulator.crt
            sudo update-ca-certificates
          fi

          echo "=== openssl verify with ca-certificates.crt ==="
          openssl verify -CAfile /etc/ssl/certs/ca-certificates.crt cosmos_emulator.crt || echo "verify failed"

          # 5. テスト実行
          cd dotnet-app && dotnet test --no-build --verbosity normal
